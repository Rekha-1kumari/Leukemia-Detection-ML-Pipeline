project_name: "HemaVision: Leukemia AI Diagnostics"
version: "1.0.0"

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  samples_dir: "data/samples"
  image_size: 224
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  classes:
    0: "Normal"
    1: "Acute Lymphoblastic Leukemia (ALL)"

model:
  backbone: "mobilenet_v3_small" # options: mobilenet_v3_small, resnet18, resnet50, custom_cnn
  num_classes: 2
  pretrained: true
  dropout_rate: 0.3
  weights_path: "weights/leukemia_detector_best.pth"

training:
  batch_size: 16
  epochs: 15
  learning_rate: 0.0003
  weight_decay: 0.0001
  early_stopping_patience: 5
  seed: 42

morphology:
  nc_ratio_threshold_high: 0.70 # Blast cells typically exhibit high Nucleus-to-Cytoplasm ratio (>0.70)
  nc_ratio_normal: 0.50
  nucleus_hsv_lower: [120, 40, 40] # Stained purple/violet nucleus in Giemsa/Leishman blood smear
  nucleus_hsv_upper: [165, 255, 255]
  cytoplasm_hsv_lower: [90, 20, 80]
  cytoplasm_hsv_upper: [140, 255, 255]

inference:
  confidence_threshold: 0.50
  risk_levels:
    low: "Low Risk (Normal Cell Morphology)"
    moderate: "Borderline / Intermediate Monitoring Required"
    high: "High Clinical Alert (Suspected Blast Lymphoblasts)"

server:
  host: "127.0.0.1"
  port: 8000
